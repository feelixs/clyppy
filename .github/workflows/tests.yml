name: Tests (Production)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  TESTS_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
  TEST_SERVER: ${{ secrets.TEST_SERVER }}
  TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}

jobs:
  test-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install discord.py

      - name: Run production tests
        run: python -u .github/workflows/scripts/test_production.py

      - name: Update badge gist
        if: always()
        run: |
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${{ secrets.BADGE_GIST_ID }}" \
            -d "{\"files\":{\"badge.json\":{\"content\":$(cat badge.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}}}"
